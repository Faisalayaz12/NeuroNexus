<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Google Form Clone</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="form-container">
        <h2>Google Form-like web form</h2>
        <form>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required>
    
          <label for="contact">Contact Number</label>
          <input type="tel" id="contact" name="contact" required>
    
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="3" required></textarea>
    
          <label for="company">Company Name</label>
          <input type="text" id="company" name="company" required>
    
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
    
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="">--Select Department--</option>
            <option value="HR">HR</option>
            <option value="Marketing">Sales</option>
            <option value="Development">Development</option>
            <option value="Finance">Marketing</option>
            <option value="Finance">Others</option>
          </select>
    
          <div class="radio-group">
            <label>Gender:</label>
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other">  Prefer not to say</label>
          </div>
          <button type="submit">Submit</button>
        </form>
      </div>
    
    </body>
    </html>
